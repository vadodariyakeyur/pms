<!DOCTYPE html>
<html class="overflow-hidden" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta
      name="description"
      content="Parcel Management System - manage parcels, drivers, buses, reports and more efficiently."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Parcel Management System</title>
    <script>
      // Runs before first paint so dark users don't get a white flash.
      // Keep in sync with src/hooks/use-theme.ts.
      var t = localStorage.getItem("theme");
      if (
        t === "dark" ||
        (!t && matchMedia("(prefers-color-scheme: dark)").matches)
      )
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
